name: Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::015454941471:role/GitHubActionsCICDRole
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t my-web-app:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag my-web-app:${{ github.sha }} 015454941471.dkr.ecr.ap-northeast-2.amazonaws.com/my-web-app:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push 015454941471.dkr.ecr.ap-northeast-2.amazonaws.com/my-web-app:${{ github.sha }}

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig --region ap-northeast-2 --name my-eks-cluster

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/my-web-app my-web-app=015454941471.dkr.ecr.ap-northeast-2.amazonaws.com/my-web-app:${{ github.sha }}

      - name: Check rollout
        run: |
          kubectl rollout status deployment/my-web-app --timeout=180s